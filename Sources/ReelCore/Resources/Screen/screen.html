<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- reel's code screen: Monaco in a page reel never shows, stepped and snapshotted one frame at a time. Nothing here
     keeps its own time: reel calls screen.pump(ms) between frames, and every animation reads screen.now. -->
<style>
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Sans'; font-weight: 400; src: url(fonts/instrument-sans-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Sans'; font-weight: 500; src: url(fonts/instrument-sans-latin-500-normal.woff2) format('woff2'); }
:root {
  --bg: #111923; --card: #1d2b3a; --fg: #E7ECF1; --line: #2a3b4e; --mut: #9BABBB; --acc: #F2B04C; --sig: #5CC8B6;
  --header: 48px;
}
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
/* A pane: a file's header and its editor, with reel's overlay on top. Two side by side after Split. */
.pane { position: absolute; top: 0; bottom: 0; overflow: hidden; background: var(--bg); --dim: 1; }
.pane + .pane { box-shadow: -1px 0 0 var(--line); }
.content, .leaving { position: absolute; inset: 0; }
.header {
  position: absolute; left: 0; right: 0; top: 0; height: var(--header); box-sizing: border-box;
  display: flex; align-items: center; gap: 12px; padding: 0 22px; background: var(--card);
  border-bottom: 1px solid var(--line); font: 500 15px 'Instrument Sans', sans-serif; color: var(--fg);
}
.header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); flex: none; }
.header .name { font-family: 'JetBrains Mono', monospace; font-weight: 500; white-space: nowrap; }
.header .path { color: var(--mut); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.header .lang { margin-left: auto; color: var(--mut); font-weight: 400; text-transform: lowercase; }
.header:empty { display: none; }
.header .since { color: var(--mut); font-weight: 400; white-space: nowrap; }
.header .stat { font-family: 'JetBrains Mono', monospace; font-size: 14px; }
.header .stat.added { color: #7FD1C0; }
.header .stat.removed { color: #F29E84; }
/* A diff: added and removed lines, their signs, and the words that changed. */
.diff-added { background: rgba(127, 209, 192, 0.11); }
.diff-removed { background: rgba(242, 158, 132, 0.11); }
.diff-removed-text { opacity: 0.7; }
.diff-word-added { background: rgba(127, 209, 192, 0.32); border-radius: 3px; }
.diff-word-removed { background: rgba(242, 158, 132, 0.34); border-radius: 3px; text-decoration: line-through;
  text-decoration-color: rgba(242, 158, 132, 0.8); }
.diff-sign-added::before, .diff-sign-removed::before { display: block; width: 100%; text-align: center;
  font-family: 'JetBrains Mono', monospace; font-weight: 500; }
.diff-sign-added::before { content: '+'; color: #7FD1C0; }
.diff-sign-removed::before { content: '\2212'; color: #F29E84; }
.code { position: absolute; left: 0; right: 0; top: var(--header); bottom: 0; }
.overlay { position: absolute; left: 0; right: 0; top: var(--header); bottom: 0; pointer-events: none; overflow: hidden; }
/* Peek: another file in a box under a line. */
.peek { box-sizing: border-box; border-top: 2px solid var(--sig); border-bottom: 2px solid var(--sig);
  background: var(--card); overflow: hidden; }
.peek .bar { height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-sizing: border-box;
  font: 500 13px 'Instrument Sans', sans-serif; color: var(--fg); border-bottom: 1px solid var(--line); }
.peek .bar .name { font-family: 'JetBrains Mono', monospace; }
.peek .bar .path { color: var(--mut); font-weight: 400; }
.peek .editor { position: relative; }
.peek-line { background: rgba(92, 200, 182, 0.14); }
/* A morph: the words moving over the editor, whose own text hides until they are in place. */
.morph { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.morph .word { position: absolute; white-space: pre; line-height: normal;
  font-feature-settings: "liga" 0, "calt" 0; }
.morphing .view-lines { opacity: 0; }
/* Follow: the line a reel is running, as a debugger marks it. */
.follow-line { background: rgba(242, 176, 76, 0.16); }
.follow-mark::before { content: '\25B6'; display: block; width: 100%; text-align: center; color: var(--acc);
  font-size: 11px; }
/* Links: arrows between places, over every pane. */
#links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#links path { fill: none; stroke: var(--sig); stroke-width: 2.5; stroke-linecap: round; }
#links .label rect { fill: var(--sig); }
#links .label text { fill: var(--bg); font: 500 15px 'Instrument Sans', sans-serif; }
#links .end { box-sizing: border-box; }
/* Monaco's own cursor is drawn only while it has focus, which a page nobody shows never gets: reel draws its own. */
.monaco-editor .cursors-layer { display: none; }
.reel-dim { opacity: var(--dim); }
.caret { position: absolute; width: 2px; background: var(--acc); }
.mark { position: absolute; box-sizing: border-box; border: 2px solid var(--acc); border-radius: 5px;
  background: rgba(242, 176, 76, 0.14); }
.mark .n { position: absolute; left: -14px; top: -14px; min-width: 24px; height: 24px; padding: 0 6px;
  box-sizing: border-box; border-radius: 12px; background: var(--acc); color: var(--bg);
  font: 500 14px/24px 'Instrument Sans', sans-serif; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.under { position: absolute; height: 2px; background: var(--sig); border-radius: 1px; }
.callout { position: absolute; max-width: 420px; padding: 9px 14px; border-radius: 8px; background: var(--sig);
  color: var(--bg); font: 500 16px/1.35 'Instrument Sans', sans-serif; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  transform-origin: 24px 0; }
.callout::before { content: ''; position: absolute; left: 18px; top: -7px; border: 7px solid transparent;
  border-top: 0; border-bottom-color: var(--sig); }
.callout.above { transform-origin: 24px 100%; }
.callout.above::before { top: auto; bottom: -7px; border: 7px solid transparent; border-bottom: 0;
  border-top-color: var(--sig); }
.callout.beside { transform-origin: 0 50%; }
.callout.beside::before { left: -7px; top: 50%; margin-top: -7px; border: 7px solid transparent; border-left: 0;
  border-right-color: var(--sig); }
</style>
</head>
<body>
<div id="stage"></div>
<svg id="links" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
  markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" style="fill: var(--sig); stroke: none"/></marker></defs></svg>
<script>
// reel's clock: animation frames run when reel pumps them, at the time reel says.
(function () {
  let frames = [];
  window.requestAnimationFrame = (cb) => { frames.push(cb); return frames.length; };
  window.cancelAnimationFrame = () => {};
  window.__runFrames = (now) => {
    for (let i = 0; i < 4 && frames.length; i++) {
      const queue = frames; frames = [];
      queue.forEach((cb) => { try { cb(now); } catch (e) {} });
    }
  };
})();
self.MonacoEnvironment = { getWorker: () => new Worker(URL.createObjectURL(new Blob(['self.onmessage=()=>{}']))) };
</script>
<script src="monaco/vs/loader.js"></script>
<script src="screen.js"></script>
</body>
</html>
