[tools]
# The swift.org toolchain CI builds with: Xcode or the Command Line Tools only add the macOS SDK.
swift = "6.4.1"
swiftformat = "0.58"
swiftlint = "0.61"

[tasks.build]
description = "Debug build of the reel command"
run = "swift build"

[tasks.test]
description = "Swift Testing suite"
run = "swift test --quiet"

[tasks.fmt]
description = "Format Swift sources"
run = "swiftformat Sources Tests Package.swift"

[tasks.lint]
description = "Check formatting and lint"
# SwiftLint loads SourceKit from the toolchain it is given, not from the Command Line Tools, which it fails to load.
run = [
    "swiftformat Sources Tests Package.swift --lint",
    "TOOLCHAIN_DIR=\"$(mise where swift)\" swiftlint lint --quiet Sources Tests",
]

[tasks.install]
description = "Release build, copied to ~/.local/bin/reel with the code screen's bundle beside it"
run = [
    "swift build -c release",
    "install -m 755 \"$(swift build -c release --show-bin-path)/reel\" ~/.local/bin/reel",
    "rm -rf ~/.local/bin/Reel_ReelCore.bundle",
    "cp -R \"$(swift build -c release --show-bin-path)/Reel_ReelCore.bundle\" ~/.local/bin/",
]

[tasks.fixture]
description = "Build build/ReelFixture.app, the app reels/fixture.reel records"
run = "scripts/fixture.sh"

[tasks.live]
description = "Record reels/fixture.reel for real and check the take (needs Screen Recording and Accessibility)"
run = "scripts/live.sh"

[tasks.live-web]
description = "Record reels/web.reel against a local page in a browser and check the take (needs Screen Recording)"
run = "scripts/live-web.sh"

[tasks.release-build]
description = "Build build/reel as the release does (scripts/build-release.sh), at version 0.0.0 unless given"
run = "scripts/build-release.sh ${VERSION:-0.0.0}"

[tasks.demos]
description = "Record reel's own demos (demos/*.reel) into docs/media; plays sound, app reels take the mouse"
run = "scripts/demos.sh"


[tasks.docs]
description = "Build the docs as CI does (docs-builder + theme + landing page) and serve them on :4000/reel/ (-- --noserve to only build)"
run = "scripts/docs.sh"
