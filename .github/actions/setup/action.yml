name: setup
description: >-
  Everything a reel build needs on a hosted macOS runner: the mise tools, the Swift toolchain among them (mise.toml
  pins it, from swift.org: hosted runners lag behind Xcode releases), and Xcode for the SDK.

inputs:
  xcode:
    description: Xcode on the runner, for the macOS SDK
    default: "26.6"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2

    - name: Select Xcode ${{ inputs.xcode }}
      shell: bash
      run: sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode }}.app"

    - name: Show the toolchain
      shell: bash
      run: swift --version

