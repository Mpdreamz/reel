name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      # Served at mpdreamz.github.io/reel: scripts/docs.sh checks this prefix against the landing page's <base href>.
      - name: Build documentation
        uses: elastic/docs-builder@main
        with:
          prefix: reel

      - name: Use the landing page
        run: scripts/docs-landing.sh .artifacts/docs/html

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .artifacts/docs/html

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
