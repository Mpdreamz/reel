name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, the tests and a release build: what `mise run lint test` and `swift build -c release` do locally.
  # Hosted runners grant no Screen Recording, so nothing here captures the screen: the writer and the render are
  # tested on generated frames and sound.
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Lint
        run: mise run lint

      # Built first and without --quiet, so a compile error shows its message rather than only "Build failed".
      - name: Build tests
        run: swift build --build-tests

      - name: Test
        timeout-minutes: 10
        # Not --quiet: every test says when it starts and ends, so one that hangs names itself before the timeout.
        # One at a time: the runner has a few virtual cores and no hardware encoder, and with every encoding test
        # opening an encoder session at once the run stalled (all of them started at 07:39:08 in run 41021183678
        # and none ended). reel itself encodes one movie at a time. About 10 seconds slower.
        run: swift test --no-parallel

      # The demos cannot be recorded here (no Screen Recording), but every tape must still parse.
      - name: Check the demo tapes
        run: for tape in demos/*.reel; do .build/debug/reel check "$tape" >/dev/null || exit 1; done

      # As the release builds it: the version written in and checked, the cask template well formed.
      - name: Release build
        run: |
          scripts/build-release.sh 0.0.0
          ruby -c packaging/homebrew/reel.rb

  # The documentation, built as the docs workflow deploys it (design-system layout, prefix, theme, landing page), so a
  # pull request that breaks it fails here rather than on main.
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build documentation
        uses: elastic/docs-builder@main
        env:
          FEATURE_NAVIGATION_PREVIEW: true
        with:
          prefix: reel

      - name: Theme and landing page
        run: scripts/docs-finish.sh .artifacts/docs/html reel
